<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ed">
  <title>Varas Atelier · Links</title>
  <meta name="description" content="Varas Atelier, estudio de moldería: tienda de moldes, web y servicios.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <!-- Fotos de los costados: cada franja se desplaza en horizontal (izquierda ← / derecha →).
         Las imágenes se repiten dos veces para que el loop no tenga corte. -->
    <aside class="gallery gallery-left" aria-hidden="true">
      <div class="tile">
        <div class="track">
          <img src="img/tela-drapeada.jpg" alt=""><img src="img/mesa-de-corte.jpg" alt="">
          <img src="img/tela-drapeada.jpg" alt=""><img src="img/mesa-de-corte.jpg" alt="">
        </div>
      </div>
      <div class="tile">
        <div class="track">
          <img src="img/mesa-de-corte.jpg" alt=""><img src="img/tela-drapeada.jpg" alt="">
          <img src="img/mesa-de-corte.jpg" alt=""><img src="img/tela-drapeada.jpg" alt="">
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="brand">
        <h1><strong>Varas</strong> Atelier</h1>
        <p>Estudio de moldería</p>
        <span class="rule" aria-hidden="true"></span>
      </header>

      <nav aria-label="Links">
        <ul class="links">
          <li><a class="link" href="tienda.html">Tienda de moldes listos<span class="arrow" aria-hidden="true"></span></a></li>
          <li><a class="link" href="#">Web del estudio<span class="arrow" aria-hidden="true"></span></a></li>
        </ul>

        <section class="group" aria-labelledby="g-servicios">
          <h2 id="g-servicios">Servicios · Cotizá tu proyecto</h2>
          <ul class="links">
            <li><a class="link" href="#">Digitalización de moldes<span class="arrow" aria-hidden="true"></span></a></li>
            <li><a class="link" href="#">Desarrollo de moldería digital personalizada<span class="arrow" aria-hidden="true"></span></a></li>
            <li><a class="link" href="#">Desarrollo de drop / colección<span class="arrow" aria-hidden="true"></span></a></li>
          </ul>
        </section>
      </nav>
    </main>

    <aside class="gallery gallery-right" aria-hidden="true">
      <div class="tile">
        <div class="track">
          <img src="img/maniqui.jpg" alt=""><img src="img/telas-dobladas.jpg" alt="">
          <img src="img/maniqui.jpg" alt=""><img src="img/telas-dobladas.jpg" alt="">
        </div>
      </div>
      <div class="tile">
        <div class="track">
          <img src="img/telas-dobladas.jpg" alt=""><img src="img/maniqui.jpg" alt="">
          <img src="img/telas-dobladas.jpg" alt=""><img src="img/maniqui.jpg" alt="">
        </div>
      </div>
    </aside>
  </div>
</body>
</html>
